<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QwenHub — Livepeer Agent Director</title>
  <style>
    :root {
      --bg: #0b1016;
      --panel: #141c26;
      --border: #1f2d3d;
      --text: #e6f4ff;
      --muted: #93adc4;
      --accent: #0ea5e9;
      --accent-warm: #f97316;
      --danger: #f87171;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(14,165,233,0.08), rgba(249,115,22,0.04));
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 18px; color: var(--text); }
    header span { color: var(--muted); font-size: 13px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: var(--radius);
      line-height: 1.45;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #0ea5e9, #06b6d4);
      color: #021018;
      font-weight: 500;
    }
    .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
    .msg img, .msg video {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
      cursor: pointer;
    }
    .attachment-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.1);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 6px;
    }
    #composer {
      border-top: 1px solid var(--border);
      padding: 14px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #preview {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    #preview .thumb {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    #preview .thumb img, #preview .thumb video { width: 100%; height: 100%; object-fit: cover; }
    #preview .thumb button {
      position: absolute;
      top: 2px;
      right: 2px;
      background: var(--danger);
      border: none;
      color: #fff;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .row { display: flex; gap: 10px; align-items: stretch; }
    textarea {
      flex: 1;
      resize: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 12px;
      font-size: 14px;
      min-height: 48px;
      max-height: 160px;
      field-sizing: content;
    }
    button {
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      color: #021018;
      border: none;
      border-radius: var(--radius);
      padding: 0 18px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #attachBtn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0 14px;
    }
    #spinner {
      display: none;
      align-self: center;
      color: var(--muted);
      font-size: 13px;
    }
    .hint { color: var(--muted); font-size: 12px; text-align: center; }

    .brand { display: flex; align-items: center; gap: 12px; }
    #logo { width: 32px; height: 32px; border-radius: 8px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    #settingsBtn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 16px;
      line-height: 1;
      border-radius: 8px;
    }
    #settingsBtn:hover { color: var(--text); border-color: var(--accent); }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: min(440px, 90vw);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { margin: 0; font-size: 16px; }
    #closeSettings {
      background: transparent;
      color: var(--muted);
      border: none;
      font-size: 20px;
      padding: 0;
    }
    .modal-content label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }
    .modal-content input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      font-size: 13px;
    }
    .modal-actions { display: flex; justify-content: flex-end; margin-top: 6px; }
    .settings-note { font-size: 11px; color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img id="logo" src="icon.png" alt="QwenHub" />
      <h1>QwenHub</h1>
    </div>
    <div class="header-actions">
      <button id="settingsBtn" title="Settings">⚙</button>
      <span id="modeBadge">web</span>
    </div>
  </header>

  <main id="chat"></main>

  <div id="spinner">Qwen is directing Livepeer…</div>

  <section id="composer">
    <div id="preview"></div>
    <div class="row">
      <button id="attachBtn" title="Attach image/video">+</button>
      <textarea id="input" placeholder="Describe the shot… (e.g. a cinematic 16:9 photo of a woman at golden hour)"></textarea>
      <button id="sendBtn">Send</button>
    </div>
    <div class="hint">Attach a reference image or click a generated result to use it as the next reference.</div>
  </section>

  <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" />

  <div id="settingsModal" class="modal" style="display:none">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="closeSettings">×</button>
      </div>
      <label>LLM base URL</label>
      <input type="text" id="settingsBaseUrl" placeholder="https://openrouter.ai/api/v1" />
      <label>LLM API key</label>
      <input type="password" id="settingsApiKey" placeholder="sk-..." />
      <label>Model</label>
      <input type="text" id="settingsModel" placeholder="qwen/qwen-2.5-7b-instruct" />
      <label>Livepeer API key (optional)</label>
      <input type="password" id="settingsLivepeerKey" placeholder="leave empty for demo mode" />
      <div class="modal-actions">
        <button id="saveSettings">Save</button>
      </div>
      <p class="settings-note" id="settingsNote"></p>
    </div>
  </div>

  <script>
    const api = typeof window !== 'undefined' && window.electronAPI ? window.electronAPI : null;
    document.getElementById('modeBadge').textContent = api ? 'desktop' : 'web';

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const spinner = document.getElementById('spinner');

    let messages = [];
    let attached = { type: null, b64: null, url: null };
    let lastOutputUrl = null;
    let settings = {};

    const settingsModal = document.getElementById('settingsModal');
    const settingsBtn = document.getElementById('settingsBtn');
    const closeSettings = document.getElementById('closeSettings');
    const saveSettingsBtn = document.getElementById('saveSettings');
    const settingsBaseUrl = document.getElementById('settingsBaseUrl');
    const settingsApiKey = document.getElementById('settingsApiKey');
    const settingsModel = document.getElementById('settingsModel');
    const settingsLivepeerKey = document.getElementById('settingsLivepeerKey');
    const settingsNote = document.getElementById('settingsNote');

    async function openSettings() {
      if (api) {
        settings = await api.getSettings();
        settingsNote.textContent = 'Settings are saved locally in the app.';
      } else {
        settingsNote.textContent = 'Settings are managed by the server in web mode.';
        settingsBtn.disabled = true;
        return;
      }
      settingsBaseUrl.value = settings.openai_base_url || '';
      settingsApiKey.value = settings.openai_api_key || '';
      settingsModel.value = settings.model || '';
      settingsLivepeerKey.value = settings.livepeer_api_key || '';
      settingsModal.style.display = 'flex';
    }

    function hideSettings() {
      settingsModal.style.display = 'none';
    }

    async function saveSettings() {
      if (!api) return;
      const updated = {
        openai_base_url: settingsBaseUrl.value.trim(),
        openai_api_key: settingsApiKey.value.trim(),
        model: settingsModel.value.trim(),
        livepeer_api_key: settingsLivepeerKey.value.trim(),
      };
      settings = await api.saveSettings(updated);
      settingsModal.style.display = 'none';
    }

    settingsBtn.onclick = openSettings;
    closeSettings.onclick = hideSettings;
    saveSettingsBtn.onclick = saveSettings;
    settingsModal.onclick = (e) => { if (e.target === settingsModal) hideSettings(); };

    function appendBubble(role, html, mediaUrl = null) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = html;
      if (mediaUrl) {
        const isVideo = /\.(mp4|webm|mov)(\?|$)/i.test(mediaUrl);
        const el = document.createElement(isVideo ? 'video' : 'img');
        el.src = mediaUrl;
        if (isVideo) { el.controls = true; el.playsInline = true; }
        el.onclick = () => useAsReference(mediaUrl, isVideo ? 'video' : 'image');
        div.appendChild(el);
        const hint = document.createElement('div');
        hint.className = 'hint';
        hint.textContent = 'Click result to attach as reference';
        div.appendChild(hint);
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function useAsReference(url, type) {
      let b64;
      if (api && url.startsWith('file://')) {
        b64 = await api.loadFile(url);
      } else {
        const blob = await fetch(url).then(r => r.blob());
        b64 = await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result.split(',')[1]);
          r.onerror = reject;
          r.readAsDataURL(blob);
        });
      }
      attached = { type, b64, url };
      renderAttachment();
    }

    function renderAttachment() {
      preview.innerHTML = '';
      if (!attached.b64) return;
      const div = document.createElement('div');
      div.className = 'thumb';
      const tag = attached.type === 'video' ? 'video' : 'img';
      const el = document.createElement(tag);
      const mime = attached.type === 'video' ? 'video/mp4' : 'image/jpeg';
      el.src = `data:${mime};base64,${attached.b64}`;
      if (tag === 'video') el.muted = true;
      div.appendChild(el);
      const rm = document.createElement('button');
      rm.textContent = '×';
      rm.onclick = () => { attached = { type: null, b64: null, url: null }; renderAttachment(); };
      div.appendChild(rm);
      preview.appendChild(div);
    }

    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;
      const b64 = await fileToBase64(file);
      attached = { type: file.type.startsWith('video') ? 'video' : 'image', b64, url: null };
      renderAttachment();
    };

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result.split(',')[1]);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    attachBtn.onclick = () => fileInput.click();

    async function send() {
      const text = input.value.trim();
      if (!text && !attached.b64) return;
      const userText = text || (attached.type === 'video' ? '[attached video]' : '[attached image]');

      let attachmentHtml = '';
      if (attached.b64) {
        attachmentHtml = `<div class="attachment-chip">${attached.type === 'video' ? '🎬' : '🖼️'} ${attached.type} attached</div><br>`;
      }
      appendBubble('user', attachmentHtml + escapeHtml(userText));
      messages.push({ role: 'user', content: userText });

      input.value = '';
      spinner.style.display = 'block';
      sendBtn.disabled = true;

      const body = {
        messages,
        image_b64: attached.type === 'image' ? attached.b64 : null,
        video_b64: attached.type === 'video' ? attached.b64 : null,
        last_output_url: lastOutputUrl,
      };
      attached = { type: null, b64: null, url: null };
      renderAttachment();

      try {
        let data;
        if (api) {
          data = await api.chat(body);
        } else {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Server error');
        }

        messages.push({ role: 'assistant', content: data.message || '' });
        appendBubble('bot', escapeHtml(data.message || 'Done.'), data.media_url);
        if (data.media_url) lastOutputUrl = data.media_url;
      } catch (err) {
        appendBubble('bot', '⚠️ ' + escapeHtml(err.message));
      } finally {
        spinner.style.display = 'none';
        sendBtn.disabled = false;
      }
    }

    sendBtn.onclick = send;
    input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

    function escapeHtml(s) {
      return s.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    appendBubble('bot', 'Hi. Describe what you want — image or video — or attach a reference image to animate it with Livepeer.');
  </script>
</body>
</html>
