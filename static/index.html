<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QwenHub — Livepeer Agent Director</title>
  <style>
    :root {
      --bg: #0f0f12;
      --panel: #18181c;
      --border: #2a2a30;
      --text: #e8e8ee;
      --muted: #9ca3af;
      --accent: #22d3ee;
      --danger: #f87171;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 18px; }
    header span { color: var(--muted); font-size: 13px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: var(--radius);
      line-height: 1.45;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .user { align-self: flex-end; background: #2563eb; }
    .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
    .msg img, .msg video {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
      cursor: pointer;
    }
    .attachment-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.1);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 6px;
    }
    #composer {
      border-top: 1px solid var(--border);
      padding: 14px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #preview {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    #preview .thumb {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    #preview .thumb img, #preview .thumb video { width: 100%; height: 100%; object-fit: cover; }
    #preview .thumb button {
      position: absolute;
      top: 2px;
      right: 2px;
      background: var(--danger);
      border: none;
      color: #fff;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .row { display: flex; gap: 10px; align-items: stretch; }
    textarea {
      flex: 1;
      resize: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 12px;
      font-size: 14px;
      min-height: 48px;
      max-height: 160px;
      field-sizing: content;
    }
    button {
      background: var(--accent);
      color: #0f0f12;
      border: none;
      border-radius: var(--radius);
      padding: 0 18px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #attachBtn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0 14px;
    }
    #spinner {
      display: none;
      align-self: center;
      color: var(--muted);
      font-size: 13px;
    }
    .hint { color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>QwenHub</h1>
    <span>Livepeer Agent Director</span>
  </header>

  <main id="chat"></main>

  <div id="spinner">Qwen is directing Livepeer…</div>

  <section id="composer">
    <div id="preview"></div>
    <div class="row">
      <button id="attachBtn" title="Attach image/video">+</button>
      <textarea id="input" placeholder="Describe the shot… (e.g. a cinematic 16:9 photo of a woman at golden hour)"></textarea>
      <button id="sendBtn">Send</button>
    </div>
    <div class="hint">Attach a reference image or click a generated result to use it as the next reference.</div>
  </section>

  <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" />

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const spinner = document.getElementById('spinner');

    let messages = [];
    let attached = { type: null, b64: null, url: null };
    let lastOutputUrl = null;

    function appendBubble(role, html, mediaUrl = null) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = html;
      if (mediaUrl) {
        const tag = mediaUrl.toLowerCase().endsWith('.mp4') || mediaUrl.toLowerCase().endsWith('.webm') ? 'video' : 'img';
        const el = document.createElement(tag);
        el.src = mediaUrl;
        if (tag === 'video') { el.controls = true; el.playsInline = true; }
        el.onclick = () => { useAsReference(mediaUrl, tag); };
        div.appendChild(el);
        const hint = document.createElement('div');
        hint.className = 'hint';
        hint.textContent = 'Click result to attach as reference';
        div.appendChild(hint);
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function useAsReference(url, type) {
      fetch(url).then(r => r.blob()).then(blob => {
        const reader = new FileReader();
        reader.onload = () => {
          const b64 = reader.result.split(',')[1];
          attached = { type: type === 'video' ? 'video' : 'image', b64, url };
          renderAttachment();
        };
        reader.readAsDataURL(blob);
      });
    }

    function renderAttachment() {
      preview.innerHTML = '';
      if (!attached.b64) return;
      const div = document.createElement('div');
      div.className = 'thumb';
      const tag = attached.type === 'video' ? 'video' : 'img';
      const el = document.createElement(tag);
      el.src = `data:${attached.type === 'video' ? 'video/mp4' : 'image/jpeg'};base64,${attached.b64}`;
      if (tag === 'video') { el.muted = true; }
      div.appendChild(el);
      const rm = document.createElement('button');
      rm.textContent = '×';
      rm.onclick = () => { attached = { type: null, b64: null, url: null }; renderAttachment(); };
      div.appendChild(rm);
      preview.appendChild(div);
    }

    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;
      const b64 = await fileToBase64(file);
      attached = { type: file.type.startsWith('video') ? 'video' : 'image', b64, url: null };
      renderAttachment();
    };

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result.split(',')[1]);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    attachBtn.onclick = () => fileInput.click();

    async function send() {
      const text = input.value.trim();
      if (!text && !attached.b64) return;
      const userText = text || (attached.type === 'video' ? '[attached video]' : '[attached image]');

      let attachmentHtml = '';
      if (attached.b64) {
        attachmentHtml = `<div class="attachment-chip">${attached.type === 'video' ? '🎬' : '🖼️'} ${attached.type} attached</div><br>`;
      }
      appendBubble('user', attachmentHtml + escapeHtml(userText));

      messages.push({ role: 'user', content: userText });

      input.value = '';
      spinner.style.display = 'block';
      sendBtn.disabled = true;

      const body = {
        messages,
        image_b64: attached.type === 'image' ? attached.b64 : null,
        video_b64: attached.type === 'video' ? attached.b64 : null,
        last_output_url: lastOutputUrl,
      };
      attached = { type: null, b64: null, url: null };
      renderAttachment();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Server error');

        messages.push({ role: 'assistant', content: data.message || '' });
        appendBubble('bot', escapeHtml(data.message || 'Done.'), data.media_url);
        if (data.media_url) lastOutputUrl = window.location.origin + data.media_url;
      } catch (err) {
        appendBubble('bot', '⚠️ ' + escapeHtml(err.message));
      } finally {
        spinner.style.display = 'none';
        sendBtn.disabled = false;
      }
    }

    sendBtn.onclick = send;
    input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

    function escapeHtml(s) {
      return s.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    appendBubble('bot', 'Hi. Describe what you want — image or video — or attach a reference image to animate it with Livepeer.');
  </script>
</body>
</html>
